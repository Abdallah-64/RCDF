<body class="bg-surface h-full flex items-center justify-center font-body-md text-body-md text-on-surface">
<main class="w-full max-w-md px-sm py-lg">

<h1 class="font-headline-lg text-headline-lg text-primary">RCDF</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-base">Admin Console</p>
</div>
<div class="bg-surface-container-lowest rounded-xl p-md shadow-[0px_4px_20px_rgba(15,23,42,0.08)] border border-outline-variant">
<form action="#" class="space-y-sm" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-xl pr-sm py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="email" name="email" placeholder="admin@rcdf.org" required="" type="email">
</div>
</div>
<div>
<div class="flex items-center justify-between mb-xs">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-xl pr-sm py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="pt-sm">
<button class="w-full flex justify-center py-3 px-sm border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
                        Login
                    </button>
</div>
</form>
</div>
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant flex items-center justify-center gap-base">
<span class="material-symbols-outlined text-[16px]">security</span> Secure Login Environment
            </p>
</div>
